<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brewed & Co.</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="#" class="logo">Brewed <span>&amp;</span> Co.</a>

        <nav class="nav-links">
            <a href="#" class="active">HOME</a>
            <a href="#">MENU</a>
            <a href="#">ABOUT</a>
            <a href="#">GALLERY</a>
            <a href="#">CONTACT</a>
        </nav>

        <a href="#" class="order-btn">Order Now</a>

    <main class="hero">
        <section class="hero-text">
            <div class="eyebrow">SPECIALTY COFFEE HOUSE</div>

            <h1>
                Where Every Cup<br>

            <p>
                Hand-crafted beverages made with single-origin beans,<br>
                brewed with intention and served with warmth.
            </p>

            <div class="buttons">
                <a href="#" class="btn primary">Explore Our Menu</a>
                <a href="#" class="btn secondary">Our Story</a>
            </div>
        </section>

        <section class="hero-image">
            <img src="coffee-image.jpg" alt="Coffee cups surrounded by plants">

        </section>
    </main>

</html>
